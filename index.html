    <!-- متحكم الشاشة الترحيبية وتجربة المستخدم والانتقال التدريجي الهادئ -->
    <script>
      (function manageTasamiSplash() {
        var splash = document.getElementById('tasami-splash-screen');
        if (!splash) return;

        var STORAGE_KEY = 'tasami_splash_viewed';
        var DISPLAY_TIME = 1500; // مدة استقرار الشاشة 1.5 ثانية
        var FADE_TIME = 1300;    // مدة التلاشي التدريجي الهادئ (1.3 ثانية كاملة)

        // مزامنة فورية لشعار المنصة المخصص وأيقونة المتصفح من الذاكرة المحلية
        try {
          var customLogo = localStorage.getItem('tasami_custom_logo');
          if (!customLogo) {
            var live = localStorage.getItem('tasami_live_content');
            if (live) {
              var parsed = JSON.parse(live);
              customLogo = parsed?.ar?.brand?.logoUrl || parsed?.en?.brand?.logoUrl || parsed?.brand?.logoUrl;
            }
          }
          if (customLogo) {
            var splashImg = document.getElementById('tasami-splash-logo-img');
            if (splashImg) splashImg.src = customLogo;
            var fav = document.querySelector("link[rel*='icon']");
            if (fav) fav.href = customLogo;
          }
        } catch (e) {}

        // التحقق من الزيارة السابقة في نفس الجلسة
        try {
          if (sessionStorage.getItem(STORAGE_KEY) === 'true') {
            document.documentElement.classList.add('splash-dismissed');
            document.body.classList.add('splash-dismissed');
            splash.remove();
            return;
          }
        } catch (e) {}

        var isFading = false;
        var startGradualCrossfade = function() {
          if (isFading) return;
          isFading = true;

          try {
            sessionStorage.setItem(STORAGE_KEY, 'true');
          } catch (e) {}

          // 1. بدء التلاشي التدريجي السلس (الشاشة تتلاشى ببطء وبنعومة + الموقع يظهر تدريجياً تحتها)
          requestAnimationFrame(function() {
            document.body.classList.add('site-revealed');
            splash.classList.add('splash-fading');
          });

          // 2. إزالة الشاشة الترحيبية من الـ DOM تماماً بعد انقضاء التلاشي كاملاً (1.3 ثانية)
          setTimeout(function() {
            document.documentElement.classList.add('splash-dismissed');
            document.body.classList.add('splash-dismissed');
            document.body.classList.remove('site-revealed');
            if (splash && splash.parentNode) {
              splash.remove();
            }
          }, FADE_TIME);
        };

        // زر الدخول التفاعلي
        var enterBtn = document.getElementById('tasami-enter-site-btn');
        if (enterBtn) {
          enterBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            startGradualCrossfade();
          });
        }

        // إتاحة النقر على أي مكان بالشاشة للتلاشي السلس
        splash.addEventListener('click', function() {
          startGradualCrossfade();
        });

        // المؤقت التلقائي بعد استقرار الشاشة
        var timerHandle = setTimeout(startGradualCrossfade, DISPLAY_TIME);

        // إلغاء التأخير إذا اكتمل تحميل كل موارد الصفحة
        window.addEventListener('load', function() {
          clearTimeout(timerHandle);
          setTimeout(startGradualCrossfade, 1200);
        });

        // صمام أمان لضمان عدم بقاء الشاشة تحت أي ظرف
        setTimeout(startGradualCrossfade, 4500);
      })();
    </script>
