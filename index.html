      @keyframes tasamiFloatMotion {

    <!-- متحكم الشاشة الترحيبية وتجربة المستخدم والانتقال التدريجي الهادئ -->
    <script>
      (function manageTasamiSplash() {
        var splash = document.getElementById('tasami-splash-screen');
        if (!splash) return;

        var STORAGE_KEY = 'tasami_splash_viewed';
        var FADE_TIME = 1300; // مدة التلاشي التدريجي الهادئ (1.3 ثانية كاملة)

        // التحقق من الزيارة السابقة في نفس الجلسة
        try {
          if (sessionStorage.getItem(STORAGE_KEY) === 'true') {
            document.documentElement.classList.add('splash-dismissed');
            document.body.classList.add('splash-dismissed');
            splash.remove();
            return;
          }
        } catch (e) {}

        var isFading = false;
        var startGradualCrossfade = function() {
          if (isFading) return;
          isFading = true;

          try {
            sessionStorage.setItem(STORAGE_KEY, 'true');
          } catch (e) {}

          // 1. بدء التلاشي التدريجي السلس (الشاشة تتلاشى ببطء وبنعومة + الموقع يظهر تدريجياً تحتها)
          requestAnimationFrame(function() {
            document.body.classList.add('site-revealed');
            splash.classList.add('splash-fading');
          });

          // 2. إزالة الشاشة الترحيبية من الـ DOM تماماً بعد انقضاء التلاشي كاملاً (1.3 ثانية)
          setTimeout(function() {
            document.documentElement.classList.add('splash-dismissed');
            document.body.classList.add('splash-dismissed');
            document.body.classList.remove('site-revealed');
            if (splash && splash.parentNode) {
              splash.remove();
            }
          }, FADE_TIME);
        };

        // العداد الرقمي التفاعلي الحي من 0% إلى 100%
        var counterElem = document.getElementById('tasami-percentage-counter');
        var fillElem = document.getElementById('tasami-progress-fill');
        var statusElem = document.getElementById('tasami-status-label');
        var percent = 0;
        var duration = 1600; // 1.6 ثانية للوصول لـ 100%
        var startTime = null;

        var statusMessages = [
          { at: 0, text: 'تهيئة أنظمة الأمان والسلامة...' },
          { at: 28, text: 'مطابقة معايير كود البناء SBC...' },
          { at: 65, text: 'مزامنة حلول الإطفاء والإنذار...' },
          { at: 92, text: 'اكتملت الجاهزية بنجاح ✓' }
        ];

        function updateProgress(timestamp) {
          if (isFading) return;
          if (!startTime) startTime = timestamp;
          var elapsed = timestamp - startTime;
          percent = Math.min(Math.floor((elapsed / duration) * 100), 100);

          if (counterElem) counterElem.textContent = percent + '%';
          if (fillElem) fillElem.style.width = percent + '%';

          for (var i = statusMessages.length - 1; i >= 0; i--) {
            if (percent >= statusMessages[i].at) {
              if (statusElem && statusElem.textContent !== statusMessages[i].text) {
                statusElem.textContent = statusMessages[i].text;
                if (percent >= 92) {
                  statusElem.classList.add('text-emerald-300');
                  statusElem.classList.remove('text-slate-200');
                }
              }
              break;
            }
          }

          if (percent < 100) {
            requestAnimationFrame(updateProgress);
          } else {
            // عند الوصول لـ 100% يبدأ التلاشي التدريجي فوراً بنعومة
            setTimeout(startGradualCrossfade, 350);
          }
        }
        requestAnimationFrame(updateProgress);

        // التفاعل الحركي 3D عند تحريك الفأرة أو لمس الشاشة (3D Interactive Tilt)
        var heroCard = document.getElementById('tasami-card-hero');
        if (heroCard && window.matchMedia('(pointer: fine)').matches) {
          window.addEventListener('mousemove', function(e) {
            var x = (e.clientX / window.innerWidth - 0.5) * 22;
            var y = (e.clientY / window.innerHeight - 0.5) * -22;
            heroCard.style.transform = 'perspective(900px) rotateY(' + x + 'deg) rotateX(' + y + 'deg)';
          });
          window.addEventListener('mouseleave', function() {
            heroCard.style.transform = 'perspective(900px) rotateY(0deg) rotateX(0deg)';
          });
        }

        // زر الدخول التفاعلي
        var enterBtn = document.getElementById('tasami-enter-site-btn');
        if (enterBtn) {
          enterBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            startGradualCrossfade();
          });
        }

        // إتاحة النقر على أي مكان بالشاشة للتلاشي السلس
        splash.addEventListener('click', function() {
          startGradualCrossfade();
        });

        // صمام أمان لضمان عدم بقاء الشاشة تحت أي ظرف
        setTimeout(startGradualCrossfade, 5000);
      })();
    </script>
